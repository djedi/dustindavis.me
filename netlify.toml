[[headers]]
  for = "/rss.xml"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[build]
  publish = "_site" # Output directory for 11ty
  command = "npx @11ty/eleventy" # Command to build the site

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview]
  command = "npx @11ty/eleventy"

[context.branch-deploy]
  command = "npx @11ty/eleventy"

# Long-lived caching. Site CSS is inlined into each page. JS/theme CSS are requested with a ?v=<content hash> (see the
# assetVersion filter) and /img/ files have hashed names, so they can be immutable.
[[headers]]
  for = "/static/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/site.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/blog.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/themes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
